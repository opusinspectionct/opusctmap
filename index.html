<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPUS Connecticut Stations Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #0b0b0b;
    }
    #container { 
      max-width: 1400px; 
      margin: 0 auto; 
      padding: 2rem;
    }
    h1 { 
      font-size: 24px; 
      margin-bottom: 1.5rem; 
      color: #0b0b0b;
      font-weight: 500;
    }
    #metrics { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
      gap: 12px; 
      margin-bottom: 1.5rem; 
    }
    .metric-card { 
      background: white; 
      border-radius: 8px; 
      border: 0.5px solid #e5e5e5;
      padding: 1rem;
    }
    .metric-label { 
      font-size: 12px; 
      color: #666;
      margin-bottom: 6px;
      font-weight: 400;
    }
    .metric-value { 
      font-size: 24px; 
      font-weight: 500; 
      color: #0b0b0b;
    }
    .metric-delta { 
      font-size: 12px; 
      color: #999;
      margin-top: 6px;
    }
    #mapContainer { 
      width: 100%; 
      height: 600px; 
      border: 0.5px solid #e5e5e5; 
      border-radius: 8px; 
      background: #f9f9f9;
      margin-bottom: 1.5rem;
    }
    .leaflet-container { 
      background: #f0ede5;
      border-radius: 8px;
    }
    #legend { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 20px; 
      font-size: 13px; 
      padding: 1rem; 
      background: white;
      border: 0.5px solid #e5e5e5;
      border-radius: 8px;
    }
    .legend-item { 
      display: flex; 
      align-items: center; 
      gap: 8px;
    }
    .legend-dot { 
      width: 14px; 
      height: 14px; 
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status { 
      padding: 1rem;
      background: white;
      border: 0.5px solid #e5e5e5;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 13px;
      color: #666;
    }
    .error { 
      padding: 1rem;
      background: #fcebeb;
      border: 0.5px solid #f09595;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 13px;
      color: #791f1f;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>OPUS Connecticut Emissions Testing Stations</h1>
    <div id="status" class="status">Loading data...</div>
    <div id="metrics"></div>
    <div id="mapContainer"></div>
    <div id="legend"></div>
  </div>

  <script>
    const categoryConfig = {
      'CURRENT_STATIONS': { hex: '#10B981', label: 'Current Stations' },
      'WAITING_LIST': { hex: '#FBBF24', label: 'Waiting List' },
      'OUT_OF_PROGRAM': { hex: '#000000', label: 'Out of Program' },
      'SCHOOLS': { hex: '#EC4899', label: 'Schools' },
      'REFERRALS': { hex: '#9CA3AF', label: 'Referrals' },
      'VIN_ONLY': { hex: '#1E40AF', label: 'VIN Only' },
      'FLEET': { hex: '#93C5FD', label: 'Fleet' },
    };

    const csvFiles = {
      'CURRENT_STATIONS': './data/CURRENT_STATIONS_-_OPUSMAP_CURRENTSTATIONS.csv',
      'WAITING_LIST': './data/WAITING_LIST_-_OPUSMAP_WAITING_LIST.csv',
      'OUT_OF_PROGRAM': './data/OUT_of_PROGRAM_-_OPUSMAP_OUTofPROGRAM.csv',
      'SCHOOLS': './data/SCHOOLS_-_OPUSMAP_SCHOOLS.csv',
      'REFERRALS': './data/REFERRALS_-_OPUSMAP_REFERRALS.csv',
      'VIN_ONLY': './data/VIN_ONLY_-_OPUSMAP_VINONLY.csv',
      'FLEET': './data/FLEET_-_OPUSMAP_FLEET.csv',
    };

    let map;
    let stationsData = {};
    const geocodeDelay = 1400;
    let geocodeQueue = [];

    function stripAddress(addr) {
      if (!addr) return '';
      return addr.replace(/\s+(REAR|Unit|Suite|#|STE|Ste)\s+.*$/i, '').trim();
    }

    function parseCSV(csvText) {
      const lines = csvText.trim().split('\n');
      if (lines.length < 2) return [];

      const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
      const data = [];

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        const obj = {};
        let inQuotes = false;
        let currentValue = '';
        let colIdx = 0;

        for (let j = 0; j < line.length; j++) {
          const char = line[j];
          const nextChar = line[j + 1];

          if (char === '"') {
            if (inQuotes && nextChar === '"') {
              currentValue += '"';
              j++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            obj[headers[colIdx]] = currentValue.trim().replace(/^"|"$/g, '');
            currentValue = '';
            colIdx++;
          } else {
            currentValue += char;
          }
        }
        obj[headers[colIdx]] = currentValue.trim().replace(/^"|"$/g, '');
        data.push(obj);
      }

      return data;
    }

    function geocodeAddress(address, city, zip) {
      if (!address || !city) return Promise.resolve(null);

      return fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address + ', ' + city + ', CT ' + zip)}&format=json&limit=1`)
        .then(r => r.json())
        .then(data => {
          if (data.length > 0) {
            return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
          }
          return null;
        })
        .catch(e => null);
    }

    async function geocodeAndPin(station, category) {
      const { hex } = categoryConfig[category];
      const cleanAddr = stripAddress(station.Address || '');

      const coords = await geocodeAddress(cleanAddr, station.City || '', station.Zip || '');

      if (coords && map) {
        const marker = L.circleMarker([coords.lat, coords.lng], {
          radius: 5,
          fillColor: hex,
          color: 'rgba(255, 255, 255, 0.8)',
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.85
        }).addTo(map);

        const tooltip = document.createElement('div');
        tooltip.innerHTML = `
          <div style="font-size: 12px;">
            <p style="margin: 0 0 6px 0; font-weight: 500;">${station['Station Name'] || 'N/A'}</p>
            <p style="margin: 0 0 4px 0; color: #666;"><strong>Address:</strong> ${station.Address || 'N/A'}, ${station.City || ''} ${station.Zip || ''}</p>
            ${station.Type ? `<p style="margin: 0 0 4px 0; color: #666;"><strong>Type:</strong> ${station.Type}</p>` : ''}
            ${station.Phone ? `<p style="margin: 0 0 4px 0; color: #666;"><strong>Phone:</strong> ${station.Phone}</p>` : ''}
            ${station.County ? `<p style="margin: 0 0 4px 0; color: #666;"><strong>County:</strong> ${station.County}</p>` : ''}
            ${station['Primary Email'] ? `<p style="margin: 0; color: #666;"><strong>Email:</strong> ${station['Primary Email']}</p>` : ''}
          </div>
        `;

        marker.bindPopup(tooltip, { maxWidth: 300, maxHeight: 250 });
        marker.on('mouseover', () => marker.openPopup());
        marker.on('mouseout', () => marker.closePopup());
      }
    }

    async function initMap() {
      const statusDiv = document.getElementById('status');
      const metricsDiv = document.getElementById('metrics');
      const legendDiv = document.getElementById('legend');

      let totalStations = 0;
      const counts = {};

      Object.keys(categoryConfig).forEach(key => {
        counts[key] = stationsData[key] ? stationsData[key].length : 0;
        totalStations += counts[key];
      });

      let metricsHTML = '';
      Object.keys(categoryConfig).forEach(key => {
        const { label } = categoryConfig[key];
        const count = counts[key];
        metricsHTML += `
          <div class="metric-card">
            <div class="metric-label">${label}</div>
            <div class="metric-value">${count}</div>
            <div class="metric-delta">[0]</div>
          </div>
        `;
      });
      metricsDiv.innerHTML = metricsHTML;

      let legendHTML = '';
      Object.keys(categoryConfig).forEach(key => {
        const { label, hex } = categoryConfig[key];
        legendHTML += `
          <div class="legend-item">
            <div class="legend-dot" style="background-color: ${hex};"></div>
            <span>${label}</span>
          </div>
        `;
      });
      legendDiv.innerHTML = legendHTML;

      map = L.map('mapContainer').setView([41.6, -72.7], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);

      statusDiv.innerHTML = `Geocoding ${totalStations} stations across 7 categories. This takes ~15-20 minutes. Pins appear as they load...`;

      let allStations = [];
      Object.keys(stationsData).forEach(key => {
        if (stationsData[key]) {
          stationsData[key].forEach(station => {
            allStations.push({ ...station, category: key });
          });
        }
      });

      for (let i = 0; i < allStations.length; i++) {
        setTimeout(() => geocodeAndPin(allStations[i], allStations[i].category), i * geocodeDelay);
      }

      setTimeout(() => {
        statusDiv.innerHTML = `Map loaded. ${totalStations} stations plotted.`;
      }, allStations.length * geocodeDelay + 2000);
    }

    async function loadData() {
      const statusDiv = document.getElementById('status');
      let loaded = 0;
      let errors = [];

      for (const [key, path] of Object.entries(csvFiles)) {
        try {
          const response = await fetch(path);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const csvText = await response.text();
          stationsData[key] = parseCSV(csvText);
          loaded++;
        } catch (error) {
          errors.push(`${key}: ${error.message}`);
          stationsData[key] = [];
          loaded++;
        }
      }

      if (errors.length > 0) {
        statusDiv.innerHTML = `<div class="error"><strong>Errors loading CSVs:</strong><br>${errors.join('<br>')}<br><br>Make sure CSV files are in a <code>./data/</code> folder.</div>`;
      }

      initMap();
    }

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
